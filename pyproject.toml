[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splitmend"
version = "0.1.0"
description = "Auditable minimum-change repair of existing machine-learning dataset partitions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ravi Shanker Thadishetti", email = "thadishetti.ravishanker@gmail.com"}]
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
experiments = ["pandas>=2.2,<3", "scikit-learn>=1.5,<2", "matplotlib>=3.9,<4"]
paper = ["python-docx>=1.2,<2"]

[project.scripts]
splitmend = "splitmend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
